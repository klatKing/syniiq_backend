spring.application.name=syniiq_backend
server.port=${PORT:8080}

# --- Base de données MySQL ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

# --- Upload d'images ---

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- CORS ---
app.cors.allowed-origins=${CORS_ORIGINS}

# --- Compte administrateur ---
app.admin.email=${ADMIN_EMAIL}
app.admin.phone=${ADMIN_PHONE}
app.admin.password=${ADMIN_PASSWORD}
app.admin.nom=${ADMIN_NOM:Administrateur Syniiq}

# --- Swagger (désactivé par défaut en ligne) ---
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true

# --- JWT ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
cloudinary.url=${CLOUDINARY_URL}